[project]
config_version = 1

[package]
name = "@unsareport/epis-lab"
version = "0.1.1"
displayName = "EPIS Lab Report Template & Layout"
description = "UNSA EPIS laboratory report format, basic info table, sections, and post-build report copy hook"
tags = ["epis", "lab", "report"]
command_prefix = "epis-lab"

[dependencies]
"@unsareport/define" = "^0.1.0"
"@unsareport/epis-lab-theming" = "^0.1.0"
"@unsareport/gdocs-code-block" = "^0.1.0"

[components]
files = ["lib.typ", "scripts/**/*", "img/**/*"]

[templates]
files = ["template/**/*"]

[commands.copy-report]
description = "Copy compiled report to a formatted filename based on exported metadata (reads UNSAREP_CONFIG_EPIS_LAB_FILENAME_FORMAT)"
commands = { any = ["bun components/@unsareport/epis-lab/scripts/copy_report.ts"] }

[hooks.build]
after = ["copy-report"]

[config-schema.filename_format]
type = "string"
required = true
default = "{course_abbr} - LAB{lab_number} - {shortnames_chain}.pdf"
doc = "Format string for renaming compiled report. Tokens: {course_name}, {course_abbr}, {lab_number}, {shortnames_chain}, {year}, etc. Passed to the copy-report hook as UNSAREP_CONFIG_EPIS_LAB_FILENAME_FORMAT."
